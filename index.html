<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Explorer</title>

    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Header section containing the page title and dog icon -->
    <header class="hero">

        <!-- Dog icon -->
        <div class="dog-icon">🐶</div>

        <!-- Main heading -->
        <h1>Dog Explorer</h1>
          
    </header>

    <!-- Main content of the webpage -->
    <main>
        
        <!-- Section for displaying and fetching random dogs -->
        <section class="dog-container">

           <!-- Section heading -->
           <h2>Discover adorable dogs!</h2>

           <!-- Button to fetch a new random dog -->
            <button class="fetch-button">
                Get Random Dog
            </button>
            
            <!-- Container for the dog image -->
            <div class="dog-card">

                <!-- Dog image received from the API -->
                <img class="dog-image" src="" alt="Random dog">
            </div>
            
        </section>
    </main>

<!-- Link the external JavaScript file -->
<script src="./script.js"></script>    
</body>
</html>
